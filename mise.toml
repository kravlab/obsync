# Tools of the project; `mise install` installs them.

[tools]
"github:kravlab/hostrunner" = "latest"
gitleaks = "latest"  # scans for secrets, in commits and in the history
lefthook = "latest"  # runs the git hooks (lefthook.yml)
node = "latest"  # runs the build, lint and tests
pnpm = "latest"  # installs package.json's devDependencies
shellcheck = "latest"  # lints the shell scripts
shfmt = "latest"  # formats the shell scripts
typos = "latest"  # spell-checks the sources and docs

# Development tasks; each runs the package.json script of the same name, so
# `mise run <task>` and `pnpm run <script>` do the same thing.

[tasks.build]
description = "Type-check, then bundle the plugin into dist/"
run = "pnpm run build"

[tasks.typecheck]
description = "Type-check src/ and test/"
run = "pnpm run typecheck"

[tasks.lint]
description = "Lint with the Obsidian community scanner's ruleset; warnings fail too"
run = "pnpm run lint"

[tasks.test]
description = "Run the Vitest suite once"
run = "pnpm run test"

[tasks."test:coverage"]
description = "Run the Vitest suite once; fails below the coverage thresholds"
run = "pnpm run test:coverage"

[tasks.format]
description = "Format every tracked file with Prettier, rewriting them"
run = "pnpm run format"

[tasks."format:check"]
description = "Check that every tracked file is formatted, without rewriting any"
run = "pnpm run format:check"

[tasks."lint:md"]
description = "Lint every tracked Markdown file"
run = "pnpm run lint:md"

[tasks."lint:sh"]
description = "Lint and check the format of the shell scripts"
run = "pnpm run lint:sh"

[tasks.spell]
description = "Spell-check every tracked file"
run = "pnpm run spell"

[tasks.knip]
description = "Find unused files, exports and dependencies"
run = "pnpm run knip"

[tasks.check]
description = "Everything that changes nothing: types, formatting, lint, spelling, unused code, tests with coverage"
depends = ["typecheck", "format:check", "lint", "lint:md", "lint:sh", "spell", "knip", "test:coverage"]

# What a new devcontainer runs (postCreateCommand); they replace the
# template's defaults in .config/mise/conf.d/devcontainer.toml, which only
# run mise install. The lockfile is frozen so a container never resolves
# versions other than the committed ones. `lefthook install` is last: it
# needs the tools the hooks call, and it writes the hooks into .git/hooks/.

[tasks.setup-dev]
description = "Install the tools, devDependencies and git hooks in the everyday devcontainer"
run = ["mise install", "pnpm install --frozen-lockfile", "lefthook install"]

[tasks.setup-agent]
description = "Install the tools, devDependencies and git hooks in the Claude Code devcontainer"
depends = ["setup-dev"]  # the same setup in both containers
