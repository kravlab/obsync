# mise config for the project's devcontainers: a cooldown for new releases
# and the tasks. mise reads .config/mise/conf.d/*.toml of a project by
# itself, next to the project's own mise.toml, which wins where both set
# the same thing.
#   mise run dc -- <cmd>, dc-task -- <task>, dev, agent  # in a devcontainer
#   mise run dev-recreate, agent-recreate  # recreate a devcontainer
#   mise run dev-rebuild, agent-rebuild  # the same, image built without cache
#   mise run agent-update  # a newer Claude Code, for every project of the host
#   mise run dc-template-update  # take the template's latest version
#   setup-dev, setup-agent  # defaults for what a new container runs
#
# From the devcontainer template (github.com/kravlad/devcontainer-template),
# which owns this file: `mise run dc-template-update` updates it and merges
# local edits.
# The specs named here are in its docs/specs/.

# The oldest mise known to apply the cooldown below (2026.3.0 takes the
# setting for an unknown field and installs without one). An older mise
# refuses the project with this version in its message, instead of going on
# unprotected.
min_version = "2026.5.0"

[settings]
# A release must have been out this long before mise installs it, on the
# host and in the containers, so that one found to be bad has time to be
# withdrawn first. It limits requests such as `latest` or `1`; a version
# pinned exactly is installed whatever its age. A project sets another age
# in its own mise.toml.
minimum_release_age = "5d"

# The tasks bring a container up (idempotent; a first run builds the
# image) and run a command (dc, dc-task), bash (dev) or Claude Code (agent)
# in it; raw hands it the terminal. They run on the host, in the project's
# root, and need the devcontainer CLI there; the hostrunner `agent` also
# needs is a tool in the project's mise config (docs/specs/mise-tasks.md).
#
# dc and dc-task get their arguments the plain way: mise appends them,
# shell-quoted, to the last command, so the command receives them exactly
# and without a shell. No usage spec and no eval: with -h/--help among the
# arguments mise skips usage, and an eval would run them as shell code.

[tasks.dc]
description = "Run a command in the everyday devcontainer: mise run dc -- <cmd> [args…]"
raw = true
# devcontainer up reads stdin to the end; </dev/null leaves it for the
# command (e.g. `echo … | mise run dc -- bash`). >/dev/null drops its JSON
# result; build logs still go to stderr.
run = """
devcontainer up --workspace-folder . >/dev/null </dev/null &&
  devcontainer exec --workspace-folder .
"""

[tasks.dc-task]
description = "Run a mise task in the everyday devcontainer: mise run dc-task -- <task> [args…]"
raw = true
run = "mise run dc -- mise run"

[tasks.dev]
description = "Start the everyday devcontainer and open bash in it"
raw = true
run = "mise run dc -- bash"

[tasks.agent]
description = "Start the Claude Code devcontainer and run claude in it"
raw = true
# </dev/null: devcontainer up reads stdin (see dc); on a terminal it would
# consume what is typed while the container starts, before claude runs.
# &&, as in dc: claude must not start in a container that did not come up,
# whatever shell options mise runs the script with.
run = """
config=.devcontainer/claude/devcontainer.json
devcontainer up --workspace-folder . --config "$config" </dev/null &&
  devcontainer exec --workspace-folder . --config "$config" claude
"""

# The recreate tasks replace a devcontainer with a new one, so an image
# change reaches it (`devcontainer up` keeps an existing container). The
# image is rebuilt where the Dockerfile changed, with the build cache;
# named volumes (bash history; ~/.claude and the package cache of the
# Claude Code container; the host's tool store and package cache) survive,
# anything else written in the old container does not, the tools it
# installed for want of them in the store included
# (docs/specs/devcontainer-shared-store.md). Nothing is started in the new
# container: dev
# and agent attach to it. </dev/null as in dc; the JSON result is the
# output.
[tasks.dev-recreate]
description = "Recreate the everyday devcontainer (rebuilding its image if needed)"
run = "devcontainer up --workspace-folder . --remove-existing-container </dev/null"

[tasks.agent-recreate]
description = "Recreate the Claude Code devcontainer (rebuilding its image if needed)"
run = "devcontainer up --workspace-folder . --config .devcontainer/claude/devcontainer.json --remove-existing-container </dev/null"

# The rebuild tasks recreate a devcontainer as above, but build its image
# without the build cache. The image pins no version of mise, so the cache
# keeps that of the build that filled it; a rebuild takes the newest one
# that has waited out the cooldown
# (docs/specs/devcontainer-unpinned-versions.md). Claude Code is not in
# the image: agent-update, below, takes a newer one. The CLI removes the
# old container before it builds, which --build-no-cache needs.
[tasks.dev-rebuild]
description = "Recreate the everyday devcontainer, building its image without cache"
run = "devcontainer up --workspace-folder . --remove-existing-container --build-no-cache </dev/null"

[tasks.agent-rebuild]
description = "Recreate the Claude Code devcontainer, building its image without cache"
run = "devcontainer up --workspace-folder . --config .devcontainer/claude/devcontainer.json --remove-existing-container --build-no-cache </dev/null"

# Puts the newest Claude Code release that has waited out the cooldown in
# the host's tool store, the volume every project's containers mount
# (docs/specs/devcontainer-shared-store.md). The Claude Code containers of
# every project run it the next time claude starts: no build, no new
# container. In the everyday container, through dc: it writes to the
# store, which the Claude Code container mounts read-only. -C /: mise
# installs outside the project, whose mise config the agent can write,
# so it reads none of it; the cooldown of [settings] is the project's
# too, hence in the environment: the same five days, written here again.
[tasks.agent-update]
description = "Install the newest Claude Code in the host's tool store, for the Claude Code devcontainers of every project"
run = "mise run dc -- env MISE_MINIMUM_RELEASE_AGE=5d mise -C / install claude@latest"

# Takes the template's latest version: the files it owns, this one among
# them, with Copier. On the host, with nothing uncommitted (Copier refuses
# a dirty tree; in the Claude Code container .devcontainer/ is read-only).
# The host needs only mise: `mise exec` brings uv, and uvx runs Copier.
# Neither is pinned (docs/specs/devcontainer-unpinned-versions.md): mise
# resolves uv's `latest` within minimum_release_age, and uvx resolves
# Copier and its dependencies on every run, so --exclude-newer gives them a
# cooldown too: the same five days as in [settings], written here a second
# time, which a project's own minimum_release_age does not change.
# --trust: the template has a task and a migration, which add hostrunner
# to the project's mise config, and Copier runs neither for less
# (docs/specs/devcontainer-hostrunner-mise.md).
# --answers-file names the template's own answers file: an update finds
# the template through that file, so Copier cannot learn its name from
# the template and reads its default, .copier-answers.yml, which is
# another template's where a project has one.
# Copier's options are appended, as in dc
# (`mise run dc-template-update -- --vcs-ref=HEAD`).
[tasks.dc-template-update]
description = "Update the devcontainer files from the template: mise run dc-template-update [-- <copier options>]"
run = 'mise exec uv@latest -- uvx --exclude-newer "5 days" copier update --trust --answers-file .copier-answers.devcontainer.yml'

# What postCreateCommand runs when a container is created: setup-dev in
# the everyday one, setup-agent in the Claude Code one. Unlike the tasks
# above they run in a container, and they are defaults: without them a
# project that defines neither, or has no mise.toml, could not create its
# containers (mise run fails with "no task … found"). mise install brings
# the tools the project's mise.toml names, and does nothing where there
# are none. A project whose stack needs more defines a task of the same
# name in its own mise.toml, which replaces the one here. Not in a
# conf.d file that sorts before this one: there this one's task wins.
#
# Each first says, on stderr, that it is the default: a project whose own
# task did not take its place (a misspelt name, one task defined where
# two were meant) would otherwise get a container with only mise install
# done and nothing to show for it. mise install is the last command, so
# its status is the task's, whatever shell options mise runs the script
# with: a failed install fails the `devcontainer up` that created the
# container.
[tasks.setup-dev]
description = "Install the project's tools in the everyday devcontainer (default: a project's own setup-dev replaces it)"
run = """
echo "setup-dev: the devcontainer template's default, mise install; a setup-dev task of the project's own replaces it" >&2
mise install
"""

[tasks.setup-agent]
description = "Install the project's tools in the Claude Code devcontainer (default: a project's own setup-agent replaces it)"
run = """
echo "setup-agent: the devcontainer template's default, mise install; a setup-agent task of the project's own replaces it" >&2
mise install
"""
